# Dev overlay. Mounts local source over the baked-in copy so
# a freshly started container uses the current code. Intended
# for `docker compose run --rm ...` (one-off commands), not
# for running the live API.
#
# Usage:
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.server.yml \
#                  -f docker-compose.dev.yml \
#                  run --rm --entrypoint /opt/venv/bin/python \
#                  api -m pytest tests/ -q

services:
  api:
    environment:
      # Tests run against a dedicated test database, never the
      # production `apmatch` DB (tests assume a clean audit_log).
      # One-time setup: docker exec apmatch-postgres psql -U apmatch \
      #   -c "CREATE DATABASE apmatch_test"
      # The pg_engine fixture runs `alembic upgrade head` on first use.
      DATABASE_URL: "postgresql+psycopg://apmatch:${APMATCH_DB_PASSWORD}@postgres:5432/apmatch_test"
      # The suite is a regression guard for the DETERMINISTIC engine: its
      # fixtures are built on OCR output. Pin the OCR backend so results are
      # identical whether or not the vLLM container happens to be up.
      # (The live API keeps the default, EXTRACTION_BACKEND=vlm.)
      EXTRACTION_BACKEND: "ocr"
    volumes:
      - ./apmatch:/app/apmatch:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./documents:/app/documents:ro
      - ./output:/app/output  # rw: diagnostics dump output/ocr/*.json
      - ./reports:/app/reports  # rw: diagnostics write reports/*.json
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - ./ruff.toml:/app/ruff.toml:ro
      # Templates are data the code reads at runtime: mount them like the code,
      # so tests never see a stale copy baked into the image (e.g. in.yaml, D-115).
      - ./templates:/app/templates:ro

# Notes:
#   - Most mounts are read-only; ./output and ./reports are writable so
#     diagnostics can dump OCR JSON and reports into the dev tree.
#   - The mounts are NOT under models/ — models stay baked in
#     the image.
#   - We don't override entrypoint here; the caller supplies
#     --entrypoint.
