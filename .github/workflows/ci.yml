name: CI

# NOTE: auto-triggers are disabled (2026-10-29). The test job requires model
# weights (~1.7 GB) and a Postgres service that ubuntu-latest doesn't provide
# by default. Enabling this properly requires: (a) downloading models in the
# workflow, (b) starting a postgres service container, (c) setting
# APMATCH_API_KEY. Deferred until after BPO foundation is stable. Trigger
# manually via Actions tab -> CI -> Run workflow. See D-099.

on:
  workflow_dispatch:  # manual trigger only
  # Auto-triggers disabled until CI is production-ready
  # (needs model weights + Postgres service). See D-099.

jobs:
  test:
    runs-on: ubuntu-latest # amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check apmatch/ scripts/ tests/

      - name: Unit + integration tests (fast)
        run: pytest tests/ -q --ignore=tests/smoke

  smoke:
    runs-on: ubuntu-latest # amd64, real hardware (Paddle oneDNN fails under QEMU; D-062)
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run full-stack smoke test
        # APMATCH_API_KEY is a GitHub Actions secret reference, not a literal.
        # A repo admin must set it in repo settings before this job can run.
        env:
          APMATCH_RUN_SMOKE: "1"
          APMATCH_API_KEY: ${{ secrets.APMATCH_API_KEY }}
        run: bash scripts/smoke_test.sh
