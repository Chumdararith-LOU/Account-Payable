# One origin for the browser: the app at /, the API at /api/ (UI-2).
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # Up to four documents per case, 20 MB each (APMATCH_MAX_UPLOAD_BYTES).
    client_max_body_size 100m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Reading four documents with the VLM can take a few minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Hashed file names: safe to cache for a long time.
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # Every app route (/review, /case/...) is the same page; never cached, so
    # a new deploy is picked up on the next reload.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
