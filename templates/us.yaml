# US-style invoice template (from the PROD-B0.6 batch diagnostic + real
# samples, PROD-B1d).
#
# Fixes vs PROD-B1c:
#   - vendor: removed bare "From" / "Supplier" — they false-match line-item
#     text ("Imported from China"). Replaced with multi-word safe labels; the
#     _extract_vendor validation rejects garbage so the heuristic still fires
#     on unlabeled documents (the common case).
#   - invoice_date: position_fallback: top-right recovers the value when the
#     label search fails.
template_id: us
style: us

invoice_number:
  labels:
    - "INVOICE #"
    - "Invoice #"
    - "Invoice No."
    - "Invoice Number"
    - "Inv. No."
  position_fallback: top-right

invoice_date:
  labels:
    - "Invoice Date"
    - "Date Issued"
    - "Date"
  candidate_order:
    - "Invoice Date"
    - "Date Issued"
    - "Date"
  formats:
    - "%b %d, %Y"    # Mar 15, 2026
    - "%B %d, %Y"    # February 10, 2025
    - "%m/%d/%Y"     # 02/10/2025
    - "%m-%d-%Y"
  position_fallback: top-right

vendor:
  strategy: labeled_then_heuristic
  labels:
    - "Billed From"
    - "Bill From"
    - "Vendor Name"
    - "Supplier Name"
    - "Vendor"
  heuristic_fallback: top_company_suffix

currency:
  symbol_map:
    - ["$", "USD"]
    - ["USD", "USD"]

totals:
  subtotal:
    labels: ["Subtotal", "Sub-total"]
  tax:
    labels: ["Sales Tax", "Tax", "VAT"]
  total:
    labels: ["Total", "Grand Total", "Amount Due"]
    exclude: ["Subtotal", "Sub-total"]

line_items:
  enabled: true
  columns:
    description: ["Description", "Item Description", "Item", "Product"]
    quantity: ["Qty", "Quantity", "Units", "Count"]
    price: ["Unit Price", "Item Rate", "Rate", "Price"]
    amount: ["Amount", "Line Total", "Total", "Value"]
  fallback: positional
