# Indian-style invoice template (from the PROD-B0.6 batch diagnostic).
#
# Observed gaps the hardcoded lists missed:
#   - invoice number labeled "INVOICE #"
#   - vendor labeled "Seller" (not "From (Vendor)")
#   - currency as a "₹" / "Rs." symbol (INR)
#   - GST as the tax label
# Note: bare "INV" is deliberately absent — it substring-matches the invoice
# NUMBER value (e.g. "INV-2026-1123") and would mis-select this template.
template_id: in
style: in

invoice_number:
  labels:
    - "INVOICE #"
    - "Invoice No"
    - "Inv No"
  position_fallback: top-right

invoice_date:
  labels:
    - "Invoice Date"
    - "Date"
  candidate_order:
    - "Invoice Date"
    - "Date"
  formats:
    - "%d/%m/%Y"
    - "%d-%m-%Y"
    - "%d-%b-%Y"

vendor:
  strategy: labeled_then_heuristic
  # "Seller" is the in-style vendor label and the selector's distinguishing
  # signal vs the us template (which uses "From"). Bare "From" is kept out so
  # the two styles don't score identically.
  labels:
    - "Seller"
  heuristic_fallback: top_company_suffix

currency:
  symbol_map:
    - ["₹", "INR"]
    - ["INR", "INR"]
    - ["Rs.", "INR"]

totals:
  subtotal:
    labels: ["Subtotal", "Sub Total", "Taxable Value"]
  tax:
    labels: ["GST", "VAT", "Tax"]
  total:
    labels: ["Total", "Grand Total", "Invoice Total"]
    exclude: ["Subtotal", "Sub Total"]

line_items:
  enabled: false
