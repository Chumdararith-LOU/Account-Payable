# Indian-style invoice template (from the PROD-B0.6 batch diagnostic + real
# INR samples, PROD-B1d).
#
# Fixes vs PROD-B1c:
#   - currency: added "Rs " (no period) — real Indian invoices often write
#     "Rs 2,110.00" without the period.
#   - vendor: multi-word safe labels; the _extract_vendor validation rejects
#     garbage so the heuristic still fires on unlabeled documents.
#   - invoice_number / invoice_date: position_fallback: top-right recovers the
#     value when the label search fails.
# Note: bare "INV" is deliberately absent — it substring-matches the invoice
# NUMBER value (e.g. "INV-2026-1123") and would mis-select this template.
template_id: in
style: in

invoice_number:
  labels:
    - "INVOICE #"
    - "Invoice No"
    - "Invoice No."
    - "Invoice Number"
    - "Inv No"
  position_fallback: top-right

invoice_date:
  labels:
    - "Invoice Date"
    - "Date"
  candidate_order:
    - "Invoice Date"
    - "Date"
  formats:
    - "%d/%m/%Y"
    - "%d-%m-%Y"
    - "%d-%b-%Y"
    # Month-name formats (us-style "Jul 12, 2026"): the selector ties us/in
    # when the vendor label is missing and picks "in" alphabetically, so the
    # in template must still parse us-style dates.
    - "%b %d, %Y"
    - "%B %d, %Y"
  position_fallback: top-right

vendor:
  strategy: labeled_then_heuristic
  labels:
    - "Seller Name"
    - "Sold By"
    - "Vendor Name"
    - "Delivered By (Vendor)"
    - "Paid To"
    - "Vendor"
  heuristic_fallback: top_company_suffix

currency:
  symbol_map:
    - ["₹", "INR"]
    - ["INR", "INR"]
    - ["Rs.", "INR"]
    - ["Rs ", "INR"]

totals:
  subtotal:
    labels: ["Subtotal", "Sub Total", "Taxable Value"]
  tax:
    labels: ["GST", "VAT", "Tax"]
  total:
    labels: ["Total", "Grand Total", "Invoice Total"]
    exclude: ["Subtotal", "Sub Total"]

line_items:
  enabled: true
  columns:
    description: ["Description", "Item Description", "Item", "Product"]
    quantity: ["Qty", "Quantity", "Units", "Count", "Qty Received", "Qty Ordered"]
    price: ["Item Rate", "Rate (INR)", "Rate", "Unit Price", "Price"]
    amount: ["Taxable (INR)", "Taxable", "Amount", "Line Total", "Total", "Value"]
  fallback: positional
