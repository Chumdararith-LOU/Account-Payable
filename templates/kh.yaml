# Khmer-style invoice template.
#
# This reproduces the pre-template hardcoded behavior EXACTLY (the regression
# guard is tests/parse/test_extractors.py against the INV_2026_1123 fixture).
# Label lists are the current apmatch/parse/invoice.py constants, verbatim.
# Bare "Vendor" is deliberately absent: the fixture carries a "VENDOR INVOICE"
# title block that would false-match before the real "From (Vendor)" label.
template_id: kh
style: kh

invoice_number:
  labels:
    - "Invoice No"
    - "Invoice Number"
    - "INV No"
    - "No."
    # kh_sme invoices use "N°:" (degree sign, not the letter o) for the number.
    - "N°"
  # kh_sme invoices print the number as a bare top-right block with no label.
  position_fallback: top-right

invoice_date:
  labels:
    - "Date"

vendor:
  strategy: labeled_then_heuristic
  labels:
    - "From (Vendor)"
    - "Bill From"
    - "Supplier"
  heuristic_fallback: top_company_suffix

currency:
  symbol_map:
    - ["$", "USD"]
    - ["USD", "USD"]
    - ["KHR", "KHR"]
  # Khmer-style documents omit the currency code for local-currency (KHR)
  # amounts but always print "$" for USD — so "no marker found" means KHR.
  default: KHR

totals:
  subtotal:
    labels: ["Subtotal", "Sub Total"]
  tax:
    labels: ["VAT", "Tax"]
  total:
    labels: ["TOTAL", "Total", "Grand Total"]
    exclude: ["Subtotal"]

line_items:
  enabled: true
  columns:
    description: ["Description", "Item Description", "Item", "Product"]
    quantity: ["Qty", "Quantity", "Units", "Count"]
    price: ["Unit Price", "Item Rate", "Rate", "Price"]
    amount: ["Amount", "Line Total", "Total", "Value"]
  fallback: positional
