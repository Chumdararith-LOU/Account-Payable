# Local dev Postgres for the apmatch store. NOT production.
#
# The credentials below (apmatch / apmatch_dev_only) are LOCAL DEV only.
# Do NOT reuse them in production; production credentials come from env vars
# at runtime (P1-12). Port 5433 (not 5432) avoids clashing with any system
# Postgres. The named volume `apmatch_pgdata` lives under Docker's own storage.
services:
  postgres:
    image: postgres:16-alpine
    container_name: apmatch-postgres
    environment:
      POSTGRES_USER: apmatch
      POSTGRES_PASSWORD: apmatch_dev_only
      POSTGRES_DB: apmatch
    ports:
      - "5433:5432"
    volumes:
      - apmatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apmatch -d apmatch"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: apmatch:dev
    container_name: apmatch-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://apmatch:apmatch_dev_only@postgres:5432/apmatch"
      # DATABASE_URL host is `postgres` (the service name), port
      # 5432 (the container's internal port, not the host-mapped 5433).
      APMATCH_API_KEY: "${APMATCH_API_KEY:?APMATCH_API_KEY must be set}"
      APMATCH_LOG_LEVEL: "${APMATCH_LOG_LEVEL:-INFO}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Named volumes are NOT needed — models are baked into the
    # image. If a dev wants to iterate on model files, they mount
    # a volume over /app/models (documented in ARCHITECTURE.md).

volumes:
  apmatch_pgdata:
